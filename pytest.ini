[pytest]
markers =
    primary: core connectivity tests (HTTP request, connect)
    secondary: informational tests (available axes)
    invasive: motion or homing tests that interact with machine state
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
