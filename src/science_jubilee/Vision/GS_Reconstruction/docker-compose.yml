# GS Reconstruction — two-service compose
#
# Services
#   colmap  colmap/colmap:latest — run COLMAP on your images
#   gs      custom image         — 3dgs-mcmc training + gs_preprocess notebook kernel
#
# Both mount the same Datasets/ and Outputs/ directories so data flows
# from the COLMAP step straight into the GS training step without copying.
#
# Quickstart
#   docker compose build gs
#
#   # 1. Run COLMAP on a scene (images must already be in Datasets/<scene>/images/)
#   docker compose run --rm colmap automatic_reconstructor \
#       --workspace_path /datasets/<scene> \
#       --image_path /datasets/<scene>/images
#
#   # 2. Train 3DGS-MCMC
#   docker compose run --rm gs conda run -n gaussian_splatting_inria \
#       python src/3dgs-mcmc/train.py \
#       -s /workspace/.../Datasets/<scene> \
#       -m /workspace/.../Outputs/<scene>
#
#   # 3. Open the notebook
#   docker compose up gs
#
# Override data paths with a .env file:
#   DATASETS_PATH=/path/to/your/Datasets
#   OUTPUTS_PATH=/path/to/your/Outputs
#   JUPYTER_PORT=8888

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:

  colmap:
    build:
      context: ../../../../   # repo root
      dockerfile: src/science_jubilee/Vision/GS_Reconstruction/Dockerfile.colmap
    <<: *gpu
    volumes:
      - ${DATASETS_PATH:-./Datasets}:/datasets

  gs:
    build:
      context: ../../../../   # repo root — Dockerfile does COPY . /workspace/science_jubilee
      dockerfile: src/science_jubilee/Vision/GS_Reconstruction/Dockerfile
    <<: *gpu
    volumes:
      - ${DATASETS_PATH:-./Datasets}:/workspace/science_jubilee/src/science_jubilee/Vision/GS_Reconstruction/Datasets
      - ${OUTPUTS_PATH:-./Outputs}:/workspace/science_jubilee/src/science_jubilee/Vision/GS_Reconstruction/Outputs
